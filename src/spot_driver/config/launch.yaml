# Launch arguments for spot_driver.launch.py.
#
# GENERATED by the Spot ROS2 Config page (web_portal/api/config_manager/launchfile.py) -- last
# written 2026-09-14 05:43:40 UTC. Hand edits survive until the next save from the page,
# which rewrites the whole file from web_portal/api/config_manager/launchschema.py. To add an
# argument permanently, add it there.
#
# Read INSIDE the wrapper container by /usr/local/bin/spot-launch, which turns each
# key into a `key:=value` argument. Keys absent from this file are not passed at all,
# so the launch file's own default applies. A change here needs a
# `docker-compose restart wrapper` run from the repo's carv_ws/ directory -- the
# file is read at node startup, same as spot_config.yaml.
#
# CREDENTIALS NEVER GO HERE. This file is tracked in git; secrets live in
# config/robot.env, which is not.

launch_arguments:

  # ===== Driver ========================================================
  # What the driver launches and how much of the robot it can touch.
  #
  # controllable is one of the five settings that keep this driver passive. Turning it on
  # starts lease_manager_node and the whole spot_ros2_control stack, which claims the lease --
  # and Spot leases are exclusive, so the tablet loses the robot. See "Control posture" in
  # CLAUDE.md.

  # Path to spot_config.yaml AS SEEN INSIDE THE CONTAINER. Pinned to
  # /spot-config/spot_config.yaml, which is where carv_ws/docker-compose.yaml mounts the
  # config directory -- any other path is a hard FileNotFoundError at launch, and an empty one
  # launches the driver with no config file at all, silently discarding every setting on the
  # Config tab including the passive control posture. Not editable from the page, and not
  # carried in any preset.
  config_file: "/spot-config/spot_config.yaml"

  # Start lease_manager_node and the spot_ros2_control stack, and run the driver in proxied
  # leasing mode with get_lease_on_action. This is the launch-time half of taking control of
  # the robot: it claims the lease, and the tablet loses it.
  controllable: False

  # ===== Image publishers ==============================================
  # The camera pipeline. Everything below the first switch is inert while it is off, and
  # turning it on costs real CPU on the CORE I/O.

  # Start the camera pipeline. Off here: the image publisher nodes cost real CPU on the CORE
  # I/O, and nothing on this robot consumes the topics today. Everything else in this group is
  # inert while it is off.
  launch_image_publishers: False

  # ===== RViz ==========================================================
  # The CORE I/O is headless, so there is no display to render into. Foxglove on port 21000 is
  # the visualisation that works here.

  # Start RViz alongside the driver. There is no $DISPLAY in the container and none on the
  # CORE I/O, so this cannot work here.
  launch_rviz: False

  # Not passed, so the launch file's own default applies: controllers_config, spot_name,
  # tf_prefix, robot_description_package, use_sim_time, depth_registered_mode,
  # publish_point_clouds, uncompress_images, publish_compressed_images, stitch_front_images,
  # rviz_config_file.
