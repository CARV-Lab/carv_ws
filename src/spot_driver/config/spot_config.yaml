# Spot driver configuration.
#
# GENERATED by the Spot ROS2 Config page (web_portal/api/config_manager/configfile.py) -- last
# written 2026-09-14 05:43:40 UTC. Hand edits survive until the next save from the page,
# which rewrites the whole file from web_portal/api/config_manager/schema.py. To add a parameter
# permanently, add it there.
#
# Behaviour only. Credentials (hostname, username, password) are NOT in this file and
# are not editable from the page -- they live in config/robot.env, are edited
# by hand, and reach the driver as environment variables. That is why this file is
# safe to commit.
#
# The driver reads this only at node startup, so changes need a
# `docker-compose restart wrapper` from the repo's carv_ws/ directory.

/**:
  ros__parameters:

    # ===== Update rates ================================================
    # How often the driver polls Spot and republishes. Higher costs CPU on the CORE I/O.

    # How often robot metrics (distance walked, run time) are polled. The default of 0.04 Hz
    # is once every 25 seconds; these barely change.
    metrics_rate: 0.04

    # How often the lease list is published. In the C++ nodes a value of 0 or less disables
    # lease publishing entirely.
    lease_rate: 1.0

    # The rate at which the driver's async task loop runs. It must be at least as fast as the
    # quickest individual task rate above, or those tasks cannot hit their requested rate and
    # the driver logs a warning.
    async_tasks_rate: 20.0

    # Rate at which joint states, TF and battery/power/fault status are published by the state
    # publisher node. Must be above 0 -- the driver silently substitutes 50.0 for anything
    # lower.
    robot_state_rate: 50.0

    # Rate at which the image publisher node requests images. It is hard to get faster than 15
    # Hz out of Spot. Must be above 0 -- the driver silently substitutes 15.0 for anything
    # lower.
    image_rate: 5.0

    # ===== Control posture =============================================
    # What the driver does to the robot on its own, and how it handles the lease and e-stop.
    #
    # Spot leases are exclusive. The tablet is the primary controller here: if this driver
    # claims the lease, the tablet loses the robot. And with start_estop on, this container
    # dying would e-stop the robot out from under the tablet. The current all-off setting is a
    # deliberate passive posture, not a default nobody looked at.

    # Take the body lease as soon as the driver starts. Leave off: leases are exclusive, so
    # claiming takes the robot away from the tablet.
    auto_claim: False

    # Power the motors on at startup. Leave off unless the driver is meant to be the primary
    # controller.
    auto_power_on: False

    # Command a stand at startup. The robot will physically stand up when the container
    # starts.
    auto_stand: False

    # How long the driver's e-stop endpoint may go without a check-in before Spot cuts power.
    # Only used when 'Register own e-stop' is on.
    estop_timeout: 9.0

    # Register a new e-stop endpoint instead of attaching to the one the tablet already holds.
    # Leave off: with it on, this container dying e-stops the robot. 'Found estop!' in the
    # startup log confirms it attached to the existing endpoint.
    start_estop: False

    # ===== Frames and naming ===========================================
    # TF tree layout and the prefix applied to frames and topics.

    # Which frame the odometry topic is expressed in. 'odom' drifts less over short distances;
    # 'vision' is smoother but can jump. Given without a prefix.
    preferred_odom_frame: "odom"

    # The root of the published TF tree. Given without a prefix.
    tf_root: "odom"

    # Namespace applied to the driver's nodes and topics. Empty means no namespace. Overridden
    # by the spot_name: = launch argument.
    spot_name: ""

    # Prefix applied to every frame in the TF tree. An empty string is a valid choice and
    # means no prefix. Overridden by the tf_prefix: = launch argument.
    frame_prefix: ""

    # ===== Commands ====================================================
    # How velocity and trajectory commands are sent to Spot.

    # How long each /cmd_vel command stays valid. Increase this if Spot stutters while you are
    # publishing velocity commands.
    cmd_duration: 0.25

    # How long each arm velocity command stays valid. Decrease it if the arm lags behind;
    # publish faster than 4 Hz when you do.
    arm_cmd_duration: 1.0

    # ===== Cameras and images ==========================================
    # Which images the driver requests and how it publishes them.
    #
    # The Launch options below currently set launch_image_publishers:=False, so the image
    # publisher nodes are not running and nothing in this group takes effect until that
    # changes.

    # Whether this robot's cameras are colour. Set to off for a greyscale robot -- leaving it
    # on there means you receive no image data at all.
    rgb_cameras: True

    # Connect to a SpotCam payload module. Off by default because of known SSL and h264
    # problems in the SpotCam client.
    initialize_spot_cam: False

    # ===== Lidar =======================================================
    # Velodyne point clouds from the Spot EAP payload.

    # Stream point clouds from the Velodyne on a Spot EAP payload, published on
    # <name>/velodyne/points. The driver publishes the cloud itself from the Boston Dynamics
    # SDK, so no ROS velodyne package is involved -- the only requirement is a robot that
    # actually carries an EAP payload.
    use_velodyne: False

    # Rate at which point clouds are published.
    velodyne_rate: 10.0

    # ===== Image stitching =============================================
    # The virtual forward camera built from Spot's front-left and front-right images. These
    # were tuned by hand; adjust them only if the stitched image looks wrong.
    #
    # Only used when the driver is launched with stitch_front_images:=True, which it is not
    # today.

    # Intrinsic matrix [fx, 0, cx, 0, fy, cy, 0, 0, 1]. fx stretches the image left-right, fy
    # zooms in, cx shifts it left-right and cy shifts it up-down.
    virtual_camera_intrinsics: [385.0, 0.0, 315.0, 0.0, 385.0, 844.0, 0.0, 0.0, 1.0]

    # The plane the stitched image is projected onto, relative to the virtual camera frame.
    virtual_camera_projection_plane: [-0.15916, 0.0, 0.987253]

    # Distance from the virtual camera frame to the projection plane.
    virtual_camera_plane_distance: 0.5

    # The stitched image is the width of the front-left image and its height plus this many
    # rows.
    stitched_image_row_padding: 1182

    # ===== Hardware and timing =========================================
    # Payload and clock settings.

    # Turn on if the arm has no gripper. This also removes 'hand' from the default camera
    # list.
    gripperless: False

    # Left unset, so the driver uses its own default: cameras_used